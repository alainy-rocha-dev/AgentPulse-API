<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1020" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)"/>
  
  <!-- Outer Rings -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="16 10"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.8"/>

  <!-- Geometry Node Hexagon -->
  <polygon points="400,160 590,270 590,490 400,600 210,490 210,270" fill="none" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Inner Nodes and Connections -->
  <line x1="400" y1="160" x2="400" y2="300" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>
  <line x1="590" y1="270" x2="470" y2="350" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>
  <line x1="590" y1="490" x2="470" y2="450" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>
  <line x1="400" y1="600" x2="400" y2="500" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>
  <line x1="210" y1="490" x2="330" y2="450" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>
  <line x1="210" y1="270" x2="330" y2="350" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.9"/>

  <!-- Central Core -->
  <circle cx="400" cy="400" r="85" fill="#040711" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)"/>
  <text x="400" y="412" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="2">AGENTPULSE</text>
  
  <!-- Outer Orbiting Dots -->
  <circle cx="400" cy="160" r="12" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="590" cy="270" r="12" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="590" cy="490" r="12" fill="#00ff9d" filter="url(#glow)"/>
  <circle cx="400" cy="600" r="12" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="210" cy="490" r="12" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="210" cy="270" r="12" fill="#00ff9d" filter="url(#glow)"/>
</svg>
