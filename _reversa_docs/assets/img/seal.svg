<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)"/>
  
  <!-- Outer Rings -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8"/>
  <circle cx="400" cy="400" r="320" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>

  <!-- Geometry Node Hexagon -->
  <polygon points="400,160 590,270 590,490 400,600 210,490 210,270" fill="none" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner Nodes and Connections -->
  <line x1="400" y1="160" x2="400" y2="300" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="590" y1="270" x2="470" y2="350" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="590" y1="490" x2="470" y2="450" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="400" y1="600" x2="400" y2="500" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="210" y1="490" x2="330" y2="450" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <line x1="210" y1="270" x2="330" y2="350" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Central Core -->
  <circle cx="400" cy="400" r="80" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)"/>
  <text x="400" y="412" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">REVERSA</text>
  
  <!-- Outer Orbiting Dots -->
  <circle cx="400" cy="160" r="10" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="590" cy="270" r="10" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="590" cy="490" r="10" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="400" cy="600" r="10" fill="#10b981" filter="url(#glow)"/>
  <circle cx="210" cy="490" r="10" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="210" cy="270" r="10" fill="#6366f1" filter="url(#glow)"/>
</svg>
